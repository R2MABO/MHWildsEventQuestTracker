name: Native ZIP builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows
          - os: ubuntu-22.04
            target: linux
          - os: macos-15-intel
            target: macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r tools/requirements-build.txt
      - name: Test application and packaging
        run: python -m unittest discover -s tests -v
      - name: Build native ZIP
        run: python tools/package_release.py
      - name: Smoke test extracted executable
        run: python tools/smoke_release.py dist/wilds-quest-tracker-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: wilds-quest-tracker-${{ matrix.target }}
          path: dist/wilds-quest-tracker-${{ matrix.target }}.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'windows'
        with:
          name: wilds-quest-tracker-source
          path: dist/wilds-quest-tracker.zip
          if-no-files-found: error
